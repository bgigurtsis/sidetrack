name: Codex installer tests

on:
  push:
    paths: ['codex/**', '.github/workflows/codex-tests.yml']
  pull_request:
    paths: ['codex/**', '.github/workflows/codex-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s codex/tests -v
